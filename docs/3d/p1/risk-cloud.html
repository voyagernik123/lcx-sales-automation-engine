<!doctype html>
<meta charset="utf-8">
<title>P1 — the spine, rendering S1</title>
<style>
  html,body{margin:0;background:#05070d;color:#eef2f9;
    font:14px/1.55 "IBM Plex Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  #wrap{width:1600px;padding:34px 38px 30px}
  .eyebrow{font:600 10.5px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.16em;
    text-transform:uppercase;color:#4d5f80;margin:0 0 9px}
  h1{font-size:21px;font-weight:600;margin:0 0 3px;letter-spacing:-.018em;color:#f2f6fc}
  .sub{color:#7d8aa3;font-size:13px;margin:0 0 20px;max-width:940px}
  .stage{position:relative;border-radius:12px;overflow:hidden;
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 22px 60px -28px rgba(0,0,0,.95)}
  canvas{display:block}
  #overlay{position:absolute;inset:0;pointer-events:none}
  .tick{position:absolute;transform:translate(-50%,0);
    font:500 10.5px/1 "IBM Plex Mono",ui-monospace,monospace;color:#5c6c8a;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .ptick{position:absolute;transform:translate(-50%,-100%);text-align:center;white-space:nowrap;
    padding-bottom:7px}
  .ptick b{display:block;font:600 9.5px/1.4 "IBM Plex Mono",ui-monospace,monospace;
    letter-spacing:.14em;color:#ffab6b;text-transform:uppercase}
  .ptick i{display:block;font:600 12px/1.2 "IBM Plex Mono",ui-monospace,monospace;
    font-style:normal;color:#f3f7fd;font-variant-numeric:tabular-nums}
  .axname{position:absolute;left:26px;top:22px;
    font:500 10px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.15em;
    text-transform:uppercase;color:#425272}
  .readout{position:absolute;top:22px;right:26px;text-align:right;
    font:500 11px/1.9 "IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .readout div{color:#93a2bb}
  .readout span{color:#4f5f7d;letter-spacing:.1em;text-transform:uppercase;font-size:9.5px;
    margin-right:12px}
  .readout hr{border:0;border-top:1px solid #1b2540;margin:9px 0 8px}
  /* THE REFUSAL, styled as a first-class state rather than an error toast. The canvas is
     left in place so the plate keeps its height — see the note in entry.ts. */
  .stage.refused{background:radial-gradient(120% 100% at 40% 34%, #101a30 0%, #080d18 70%)}
  .legend.refused span:not(:last-child){display:none}
  .legend.refused{color:#8fa0bd}
  .refusal{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    padding:0 90px;gap:10px}
  .refusal b{font:600 11px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.16em;
    color:#8fa0bd}
  .refusal p{margin:0;max-width:720px;color:#c3cee0;font-size:15px;line-height:1.6}
  .refusal code{font:500 11px/1.6 "IBM Plex Mono",ui-monospace,monospace;color:#6b7a99;
    white-space:pre-wrap}
  .legend{display:flex;gap:30px;margin-top:16px;font-size:12px;color:#7d8aa3;align-items:baseline;
    flex-wrap:wrap}
  .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:0}
  .swl{display:inline-block;width:14px;height:2px;border-radius:2px;margin-right:8px;
    vertical-align:3px;background:#7FB2FF}
  b.k{color:#eef2f9;font-weight:600}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
  #policy{margin-top:14px;max-width:1520px;color:#3f4d68;font-size:10.5px;line-height:1.7;
    font-family:"IBM Plex Mono",ui-monospace,monospace}
</style>
<div id="wrap">
  <p class="eyebrow">LCX · Intel · Quarterly forecast · rendered by @lcx/gl</p>
  <h1>10,000 simulated quarters</h1>
  <p class="sub">Every point is one simulated outcome of the open book. The three markers are
    the only three numbers the product reports today.</p>
  <div class="stage">
    <div id="overlay"><div class="axname">Portfolio outcome</div>
      <div class="readout" id="ro"></div></div>
    <canvas id="c" width="3200" height="1480" style="width:1600px;height:740px"></canvas>
  </div>
  <div class="legend">
    <span><i class="sw" style="background:#2C6BFF"></i>simulated outcome <b class="k mono" id="n"></b></span>
    <span><i class="swl"></i>density <span class="mono" id="bw" style="color:#5f6f8d"></span></span>
    <span><i class="sw" style="background:#ff8a3d"></i>reported today <b class="k">p10 · p50 · p90</b></span>
    <span class="mono" id="stats"></span>
  </div>
  <p id="policy"></p>
</div>
<script type="module" src="./bundle.js"></script>
