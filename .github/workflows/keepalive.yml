# Keep the API warm. Render spins a free web service down after fifteen idle minutes and a cold start
# takes 30–60 s, during which the sign-in page's first probe fails. A GET every ten minutes keeps the
# instance awake so the first visitor never meets a cold start. No secrets: /health is public and
# answers 200 whether or not the database is reachable (liveness, not readiness).
# The proper fix is a paid instance (scale plan W4.1); this is the bridge until then.
name: api-keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /health (retries cover a cold start)
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            --retry 6 --retry-delay 10 --retry-all-errors --max-time 75 \
            https://lcx-sales-api.onrender.com/health
