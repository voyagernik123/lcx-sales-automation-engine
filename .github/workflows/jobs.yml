# Scheduled batch jobs — run the API's job CLIs directly against Supabase.
# Free (GitHub Actions minutes), immune to Render's free-tier spin-down.
#
# Repo secrets required (Settings → Secrets and variables → Actions):
#   DATABASE_URL        Supabase SESSION POOLER string (GH runners need IPv4)
#   COINGECKO_API_KEY   demo key
name: scheduled-jobs

on:
  schedule:
    - cron: '0 5 * * *'   # market_refresh — daily 05:00 UTC
    - cron: '0 6 * * *'   # discover_new_tokens — daily 06:00 UTC
    - cron: '0 7 * * *'   # score_refresh — daily 07:00 UTC
    - cron: '50 23 * * *' # kpi_snapshot — daily 23:50 UTC
    - cron: '0 3 * * 1'   # universe_sync — Mondays 03:00 UTC
    - cron: '0 4 * * 0'   # signals_prune — Sundays 04:00 UTC
    - cron: '30 5 * * *'  # exchange_sync — daily 05:30 UTC
    - cron: '30 7 * * *'  # daily_rules — daily 07:30 UTC (after scoring)
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run'
        required: true
        type: choice
        options:
          - universe_sync
          - discover_new_tokens
          - market_refresh
          - score_refresh
          - kpi_snapshot
          - signals_prune
          - exchange_sync
          - daily_rules

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Resolve job from schedule
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "0 5 * * *")   echo "job=market_refresh" >> "$GITHUB_OUTPUT" ;;
              "0 6 * * *")   echo "job=discover_new_tokens" >> "$GITHUB_OUTPUT" ;;
              "0 7 * * *")   echo "job=score_refresh" >> "$GITHUB_OUTPUT" ;;
              "50 23 * * *") echo "job=kpi_snapshot" >> "$GITHUB_OUTPUT" ;;
              "0 3 * * 1")   echo "job=universe_sync" >> "$GITHUB_OUTPUT" ;;
              "0 4 * * 0")   echo "job=signals_prune" >> "$GITHUB_OUTPUT" ;;
              "30 5 * * *")  echo "job=exchange_sync" >> "$GITHUB_OUTPUT" ;;
              "30 7 * * *")  echo "job=daily_rules" >> "$GITHUB_OUTPUT" ;;
              *) echo "Unknown schedule" && exit 1 ;;
            esac
          fi
      # ── THE SECRET IS THE SWITCH ────────────────────────────────────────────
      #
      # These eight jobs WRITE TO PRODUCTION. Installing eight unattended writers
      # on a schedule is not something to switch on for someone without them
      # knowing the hour it starts — so the file can be installed safely, and the
      # thing that actually starts it is the repo secret only the owner can add.
      #
      # With no `DATABASE_URL` secret the run SKIPS cleanly and says so. It does
      # not fail: eight red crosses every day would be noise that trains everyone
      # to ignore this workflow, and a job that has never run is not a job that
      # failed. It also does not silently succeed — a green tick with no notice
      # would read as "the sweep ran and found nothing", which is the exact
      # collapse (never-ran vs genuinely-quiet) this platform refuses everywhere
      # else. See docs/SCHEDULED_JOBS_NOT_INSTALLED.md.
      - name: Are the credentials present?
        id: creds
        env:
          DB: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DB" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=scheduled-jobs NOT ARMED::${{ steps.pick.outputs.job }} did not run: no DATABASE_URL repo secret. This job has NEVER run — that is not the same as running and finding nothing. Add DATABASE_URL (Supabase SESSION POOLER, runners need IPv4) and COINGECKO_API_KEY under Settings → Secrets and variables → Actions, and the next scheduled tick starts it."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ${{ steps.pick.outputs.job }}
        id: run
        if: steps.creds.outputs.present == 'true'
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          set -o pipefail
          npx tsx src/jobs/cli.ts "${{ steps.pick.outputs.job }}" 2>&1 | tee /tmp/job.log

      # ── PUT THE DIAGNOSIS IN THE SUMMARY, NOT ONLY IN THE LOG ───────────────
      #
      # These jobs failed silently for a day. The cause was Supabase's direct host
      # being IPv6-only while runners are IPv4-only, and finding that meant opening
      # a run, expanding a step and reading a stack trace. The runner now heals that
      # itself — but the NEXT connection failure will be a credential or a region,
      # and nobody should have to dig for it twice.
      #
      # So the two failures that are ACTIONABLE BY THE OWNER AND ONLY BY THE OWNER
      # get lifted to an annotation on the run itself, each naming the one fix.
      # Everything else stays as it is: this must not turn arbitrary job failures
      # into reassuring summaries.
      - name: Why did it fail?
        if: failure() && steps.run.outcome == 'failure'
        run: |
          if grep -q 'REJECTED THE CREDENTIAL' /tmp/job.log 2>/dev/null; then
            REGION=$(grep -o 'aws-[0-9]*-[a-z0-9-]*\.pooler\.supabase\.com:[0-9]*' /tmp/job.log | head -1)
            echo "::error title=scheduled-jobs — WRONG PASSWORD IN THE DATABASE_URL SECRET::The runner reached ${REGION} and it rejected the credential (28P01). The HOST is right, so no other region will help and this is not the IPv6 problem. The DATABASE_URL repo secret holds a password this project does not accept — note the API on Render connects fine through the same pooler logic, so the two secrets differ. Fix: Settings → Secrets and variables → Actions → DATABASE_URL. Percent-encode # / ? % in the password (# is %23), or the URL truncates it silently."
          elif grep -q 'MALFORMED URL' /tmp/job.log 2>/dev/null; then
            echo "::error title=scheduled-jobs — THE DATABASE_URL SECRET DOES NOT PARSE::It names the Supabase direct host but does not parse as a URL that reaches it, which means an unencoded # / ? or % in the password. Everything after it is read as a fragment, path or query and the password is silently truncated. Percent-encode it (# → %23, / → %2F, ? → %3F, % → %25)."
          elif grep -q 'every pooler candidate failed' /tmp/job.log 2>/dev/null; then
            echo "::error title=scheduled-jobs — NO REACHABLE DATABASE HOST::The direct host is IPv6-only (runners are IPv4-only) and every pooler region in the sweep refused. If this project lives outside the default region list, set the SUPABASE_POOLER_REGIONS repo variable to its region."
          else
            echo "::error title=scheduled-jobs — ${{ steps.pick.outputs.job }} FAILED::Not a connection problem the runner recognises. Open the 'Run ${{ steps.pick.outputs.job }}' step; the error is at the end."
          fi
          exit 1
