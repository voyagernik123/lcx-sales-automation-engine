<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LCXOS</title>
    <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      /*
       * THIS SCRIPT READ A KEY THAT NOTHING HAS EVER WRITTEN, so it did nothing, for everyone,
       * on every load. It asked for `lcx-os:ui:v1`. `useUIStore` persists through
       * `lib/persistence.ts`, whose key builder is `lcx-os:<scope>:ui:v1` where `<scope>` is the
       * operator's lowercased email or the literal `anon` — never empty. So the real key is
       * `lcx-os:nik@lcx.com:ui:v1`, and `lcx-os:ui:v1` was the only occurrence of that string in
       * the repository: a read with no writer.
       *
       * The consequence is the exact thing the comment below this promises does not happen — every
       * dark-mode operator got a white flash on every navigation, because the class was never added
       * before paint and only `AppLayout` put it back after the shell mounted. It also meant
       * `/select`, which lives OUTSIDE `AppLayout`, could never be dark from stored preference at
       * all: nothing else on that route ever sets the class.
       *
       * It went unseen because a dead anti-flash script and a working one differ only in a frame,
       * and nothing measures a frame. It surfaced from a theme-capture sweep that had to seed the
       * store to drive the app, found the app ignoring what it wrote, and looked for the writer.
       *
       * THE SCOPE IS RESOLVED THE SAME WAY `persistence.ts` RESOLVES IT — same email key, same
       * lowercase, same trim, same `anon` fallback — because two spellings of one rule is how this
       * broke. The unscoped key is still tried as a fallback so a reader who somehow holds one is
       * not regressed, and because an extra read costs nothing before paint.
       */
      try {
        var email = (localStorage.getItem('lcx_operator_email') || 'anon').trim().toLowerCase() || 'anon';
        var stored = localStorage.getItem('lcx-os:' + email + ':ui:v1')
          || localStorage.getItem('lcx-os:anon:ui:v1')
          || localStorage.getItem('lcx-os:ui:v1');
        var parsed = null;
        if (stored) { parsed = JSON.parse(stored); }
        /* DARK BY DEFAULT (THE PRODUCTION, P1): only an explicit stored `darkMode: false` keeps the page light.
           No stored state, or a state that never touched the toggle, is the lit product. */
        if (!(parsed && parsed.state && parsed.state.darkMode === false)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="min-h-screen" style="background-color: #F4F7FC">
    <script>
      /* Pre-hydration: match the stored theme so dark-mode users never see a white flash. */
      if (document.documentElement.classList.contains('dark')) {
        document.body.style.backgroundColor = '#090E1B';
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
