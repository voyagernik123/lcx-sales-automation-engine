<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LCXOS</title>
    <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      try {
        const stored = localStorage.getItem('lcx-os:ui:v1');
        if (stored) {
          const parsed = JSON.parse(stored);
          if (parsed && parsed.state && parsed.state.darkMode) {
            document.documentElement.classList.add('dark');
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body class="min-h-screen" style="background-color: #f4f6fa">
    <script>
      /* Pre-hydration: match the stored theme so dark-mode users never see a white flash. */
      if (document.documentElement.classList.contains('dark')) {
        document.body.style.backgroundColor = '#0b1220';
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
