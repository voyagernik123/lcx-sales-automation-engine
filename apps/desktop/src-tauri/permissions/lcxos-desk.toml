## The LCXOS desk's native surface, named once.
##
## `build.rs` declares the app's ACL manifest, which flips app commands to deny-by-default.
## This file is the other half: the explicit, documented list of what is allowed back, so the
## grant is a decision somebody made rather than a default nobody chose.
##
## The `allow-*` / `deny-*` permissions referenced here are AUTOGENERATED by `tauri-build` from
## the command list in `build.rs` (`permissions/autogenerated/`, git-ignored because it is
## derived). Referencing an identifier that does not exist is a BUILD failure, not a runtime
## one — `tauri_utils::acl::resolved` raises `UnknownPermission` while compiling. That is the
## point: this file cannot drift from `build.rs` without the build saying so.

[[set]]
identifier = "lcxos-desk"
description = """
The six native commands the LCXOS desk actually calls, and nothing else.

Each is granted because a specific line of the shipped frontend invokes it — not because it \
seemed harmless. Verified by grep against apps/web/src, not assumed:

  secret_set             lib/terminal.ts:103  — write the desk credential to the Keychain
  secret_get             lib/terminal.ts:75   — hydrate the credential at startup
  secret_delete          lib/terminal.ts:125  — sign-out
  diagnostics_append     lib/terminal.ts:157  — write a [web]-attributed record to the desk log
  update_install_precheck lib/terminal.ts:312 — refuse a doomed update before downloading 5MB
  haptic_tap             lib/feedback.ts:155  — trackpad detent on a governed write

WHAT THIS GRANT DOES NOT BUY, stated here because the opposite is the easy thing to believe. \
Tauri's ACL is scoped by ORIGIN and by WINDOW/WEBVIEW LABEL. It is not scoped by CALLER. \
Script injected into the main webview runs at the same local origin, in the same webview, as \
the desk's own React bundle, so it is indistinguishable from it at this layer and these six \
stay reachable to it. Granting them is a statement that the desk needs them, not a claim that \
an injected caller cannot use them. The delivery path is closed at the WRITE (finding #7, \
56e38d7) and at every href sink; this file is the second wall, not the first.
"""
permissions = [
    "allow-secret-set",
    "allow-secret-get",
    "allow-secret-delete",
    "allow-diagnostics-append",
    "allow-update-install-precheck",
    "allow-haptic-tap",
]
