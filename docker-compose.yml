services:
  postgres:
    image: postgres:16-alpine
    container_name: lcx-sales-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: lcx
      POSTGRES_PASSWORD: lcx_dev_password
      POSTGRES_DB: lcx_sales
    volumes:
      - lcx_sales_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lcx -d lcx_sales"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lcx_sales_pgdata:
